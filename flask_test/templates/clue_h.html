<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy Clue</title>
    <style>
        /* Existing styles */

        @font-face {
            font-family: 'clue_font';
            src: url("{{ url_for('static', filename='fonts/Korinna Bold.ttf') }}") format('truetype');
        }

        body {
            background-color: black;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling */
        }
        .board {
            position: relative;
            width: 100vw;
            height: 100vh;
            transform-origin: top left;
        }
        .clue {
            position: absolute;
            background-color: #010877; /* Blue */
            border: none;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box; /* Include padding and border in element's total width and height */
            font-size: 10em;
            font-family: 'clue_font', Arial, sans-serif; /* Use custom font */
            padding: 10px; /* Add padding if needed for better text placement */
            width: 100%; /* Ensure the text container takes full width of the element */
            height: 100%; /* Ensure the text container takes full height of the element */
            text-shadow: 19px 14px 0px rgba(0, 0, 0, 1); /* Add shadow effect */
            padding-top: 5%; /* Adjust this value until the text is centered */
            padding-left: 20%; /* Adjust this value until the text is centered */
            padding-right: 20%; /* Adjust this value until the text is centered */
            width: 3236px;
            height: 1810px;
            left: 0px;
            top: 0px;
        }
        .button {
            background-color: transparent; /* Transparent background */
            color: #fff; /* White text color */
            font-size: 2em;
            font-family: 'Arial', sans-serif; /* Font family */
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s, transform 0.3s; /* Smooth transition for hover effects */
            display: inline-block;
            position: absolute;
            top: 100px; /* Adjusted vertical position */
            left: 100px; /* Adjusted horizontal position */
            width: 100px;
            height: 40px;
            text-align: center;
        }

        .button:hover {
            color: #bdbdbd; /* Light gray text color on hover */
            transform: scale(1.05); /* Slight scale-up effect on hover */
        }
    </style>
    <!-- Include Socket.IO client library -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"
        integrity="sha384-/KNQL8Nu5gCHLqwqfQjA689Hhoqgi2S84SNUxC3roTe4EhJ9AfLkp8QiQcU8AMzI"
        crossorigin="anonymous"></script>
</head>
<body>
    <div class="board" id="board">
        <div class="clue">{{ clue }}</div>
        <div class="button" onclick="closeScreen()">Close</div>
    </div>
    <script>
        function scaleBoard() {
            const board = document.getElementById('board');
            const scaleX = window.innerWidth / 3236; // Replace 3236 with your design width
            const scaleY = window.innerHeight / 1810; // Replace 1810 with your design height
            const scale = Math.min(scaleX, scaleY);
            board.style.transform = `scale(${scale})`;

            // Center the board horizontally
            const boardWidth = 3236 * scale; // Replace 3236 with your design width
            const offsetX = (window.innerWidth - boardWidth) / 2;
            board.style.left = `${offsetX}px`;
        }

        window.addEventListener('resize', scaleBoard);
        window.addEventListener('load', scaleBoard);

        function closeScreen() {
            window.location.href = '/main_board_h';
            // If using Electron or another method to communicate with the main process, include that here
            // const { ipcRenderer } = require('electron');
            // ipcRenderer.send('navigate-player', 'http://localhost:5000/main_board_p');
        }

        // Socket.IO client code
        var socket = io('/game');

        socket.on('connect', function() {
            console.log('Connected to server');
        });

        socket.on('button_press', function(data) {
            var player = data.player;
            var message = 'Player ' + player + ' pressed the button!';
            console.log(message);
            // Update the clue screen accordingly
            displayPlayerPress(message);
        });

        function displayPlayerPress(message) {
            // Create an overlay or update the DOM to show the message
            var overlay = document.createElement('div');
            overlay.id = 'player-press-overlay';
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.width = '100vw';
            overlay.style.height = '100vh';
            overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.8)';
            overlay.style.display = 'flex';
            overlay.style.justifyContent = 'center';
            overlay.style.alignItems = 'center';
            overlay.style.color = '#fff';
            overlay.style.fontSize = '5em';
            overlay.style.zIndex = '1000'; // Ensure it overlays other content
            overlay.innerText = message;

            // Append the overlay to the body
            document.body.appendChild(overlay);

            // Optionally, remove the overlay after a certain time
            setTimeout(function() {
                overlay.remove();
            }, 3000); // Remove after 3 seconds
        }
    </script>
</body>
</html>
