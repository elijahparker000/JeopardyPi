<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Preload fonts and images if necessary -->
    <meta charset="UTF-8">
    <title>Jeopardy Clue</title>
    <style>
        @font-face {
            font-family: 'clue_font';
            src: url("{{ url_for('static', filename='fonts/Korinna Bold.ttf') }}") format('truetype');
        }
        @font-face {
            font-family: 'cat_font';
            src: url("{{ url_for('static', filename='fonts/univers-75-black.ttf') }}") format('truetype');
        }

        body {
            background-color: black;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling */
        }
        .board {
            position: relative;
             /*width: 100vw;
            height: 100vh; */
            width: 20783px;
            height: 15362px;
            transform-origin: top left;
        }
        .clue, .nameplate, .score {
            position: absolute;
        }
        .clue {
            background-color: #010877; /* Blue */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            font-size: 40em;
            font-family: 'clue_font', Arial, sans-serif;
            padding: 10px;
            text-shadow: 19px 14px 0px rgba(0, 0, 0, 1);
            padding-left: 20%;
            padding-right: 20%;
        }
        /*.nameplate {
            background-size: cover;
            background-position: center;
            background-color: #010877; /* Blue */
            /*border: none;
            color: transparent;
        }*/
        .nameplate {
            position: absolute;
            width: 3236px;
            height: 1810px;
            background-size: cover;
            background-position: center;
            background-color: #010877; /* Blue */
            border: none;
            color: transparent;
        }
        .score {
            position: absolute;
            width: 3236px;
            height: 800px;
            background-color: #010877; /* Blue */
            border: none;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 35em;
            font-family: 'cat_font', Arial, sans-serif;
            text-shadow: 19px 21px 0px rgba(0, 0, 0, 1);
            box-sizing: border-box;
            /*padding-top: 8%;*/
        }
        /* Generate positions for nameplates */
        {% set nameplate_positions = [768, 4772, 8776, 12780, 16784] %}
        {% for idx in range(5) %}
        #nameplate{{ idx+1 }} {
            left: {{ nameplate_positions[idx] }}px;
            top: 13360px;
        }
        #score{{ idx+1 }} {
            left: {{ nameplate_positions[idx] }}px;
            top: 12380px;
        }
        {% endfor %}
        /*.score {
            background-color: #010877; /* Blue */
            /*border: none;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 35em;
            font-family: 'cat_font', Arial, sans-serif;
            text-shadow: 19px 21px 0px rgba(0, 0, 0, 1);
            box-sizing: border-box;
            padding-top: 8%;
        }*/
        .buzz-indicator {
            position: absolute;
            width: 100px; /* Adjust thickness */
            height: 15362px;
            background-color: white;
            color: white;
            display: none; /* Initially hidden */
            z-index: 1000; /* Ensure it's on top */
        }
        
        #left-indicator {
            left: 0;
        }
        
        #right-indicator {
            right: 0
        }
    </style>
</head>
<body>
    <div class="board" id="board">
        <!-- Clue -->
        <div class="clue" id="clue">{{ clue }}</div>

        <!-- Nameplates -->
        <div class="nameplate" id="nameplate1" style="background-image: url('{{ url_for('static', filename='images/names/player_name.png') }}');"></div>
        <div class="nameplate" id="nameplate2" style="background-image: url('{{ url_for('static', filename='images/names/player_name.png') }}');"></div>
        <div class="nameplate" id="nameplate3" style="background-image: url('{{ url_for('static', filename='images/names/player_name.png') }}');"></div>
        <div class="nameplate" id="nameplate4" style="background-image: url('{{ url_for('static', filename='images/names/player_name.png') }}');"></div>
        <div class="nameplate" id="nameplate5" style="background-image: url('{{ url_for('static', filename='images/names/player_name.png') }}');"></div>

        <!-- Scores -->
        <div class="score" id="score1">${{ scores['1'] }}</div>
        <div class="score" id="score2">${{ scores['2'] }}</div>
        <div class="score" id="score3">${{ scores['3'] }}</div>
        <div class="score" id="score4">${{ scores['4'] }}</div>
        <div class="score" id="score5">${{ scores['5'] }}</div>

        <!-- Indicators -->
        <div id="left-indicator" class="buzz-indicator"></div>
        <div id="right-indicator" class="buzz-indicator"></div>

        <!-- Timeout Audio -->
        <!-- <audio id="timeout-sound" src="{{ url_for('static', filename='audio/out_of_time.mp3') }}"></audio> -->
    </div>
    <script>
        // Design dimensions
        const designWidth = 20783;
        const designHeight = 15362;

        // Positions for nameplates and scores
        //const nameplatePositions = [768, 4772, 8776, 12780, 16784];
        //const nameplateTop = 13360;
        //const scoreTop = 12380;

        function scaleBoard() {
            const board = document.getElementById('board');
            const scaleX = window.innerWidth / designWidth;
            const scaleY = window.innerHeight / designHeight;
            const scale = Math.min(scaleX, scaleY);
            board.style.transform = `scale(${scale})`;

            // Center the board horizontally
            const boardWidth = designWidth * scale;
            const offsetX = (window.innerWidth - boardWidth) / 2;
            board.style.left = `${offsetX}px`;

            // Position elements
            positionElements();
        }

        function positionElements() {
            // Clue
            const clue = document.getElementById('clue');
            clue.style.left = '191px';
            clue.style.top = '192px';
            clue.style.width = '20401px';
            clue.style.height = '11996px';
        }

        window.addEventListener('resize', scaleBoard);
        window.addEventListener('load', function() {
            scaleBoard();
            startSSE();

            // Initially hide the indicators
            document.getElementById('left-indicator').style.display = 'none';
            document.getElementById('right-indicator').style.display = 'none';

            // Initially hide the clue
            document.getElementById('clue').style.display = 'none';
        });

        function startSSE() {
            console.log('Attempting to start SSE connection');
            const eventSource = new EventSource('/stream');

            eventSource.onopen = function(e) {
                console.log('SSE connection opened');
            };

            // Listen for events of type 'button_press'
            eventSource.addEventListener('button_press', function(e) {
                console.log('Received button_press event:', e.data);
                if (e.data) {
                    const event = JSON.parse(e.data);
                    if (event.player) {
                        const message = 'Player ' + event.player + ' pressed the button!';
                        console.log('Received event:', message);
                        displayPlayerPress(event.player);
                    }
                }
            });

            eventSource.onerror = function(e) {
                console.error('SSE error:', e);
                // Optionally handle reconnection logic here
                if (eventSource.readyState === EventSource.CLOSED) {
                    console.log('SSE connection closed. Reconnecting...');
                    setTimeout(startSSE, 1000);  // Retry after 1 second
                }
            };

            // Inside startSSE() function
            eventSource.addEventListener('score_update', function(e) {
                console.log('Received score_update event:', e.data);
                if (e.data) {
                    const event = JSON.parse(e.data);
                    updateScores(event.scores);
                }
            });

            eventSource.addEventListener('clue_control', function(e) {
                console.log('Received clue_control event:', e.data);
                const data = JSON.parse(e.data);
                if (data.action === 'show_clue') {
                    console.log('show_clue action received');
                    // Display the clue
                    showClue('{{ clue }}');
                } else if (data.action === 'enable_buzz') {
                    console.log('enable_buzz action received');
                    // Show buzz-in indicators
                    showBuzzIndicators();
                } else if (data.action === 'buzzing_ended') {
                    console.log('buzzing_ended action received');
                    removeBuzzIndicators();
                    playTimeoutSound();
                }
            });
        }

        var buzzedPlayerId = null;

        // Function to display the overlay when a player presses the button
        function displayPlayerPress(playerId) {
            console.log('Displaying overlay for player:', playerId);
            buzzedPlayerId = playerId;

            // Highlight the buzzed player's nameplate or score
            var nameplate = document.getElementById('nameplate' + playerId);
            if (nameplate) {
                nameplate.style.border = '100px solid yellow'; // Highlight with a border
            }
        }

        // Function to reset the UI after the host makes a decision
        function resetBuzzIn() {
            // Remove highlight from the player's nameplate
            var nameplate = document.getElementById('nameplate' + buzzedPlayerId);
            if (nameplate) {
                nameplate.style.border = 'none';
            }
            buzzedPlayerId = null;

            // Hide the decision buttons
            var decisionButtons = document.getElementById('decision-buttons');
            if (decisionButtons) {
                decisionButtons.style.display = 'none';
            }
        }

        function updateScores(scores) {
            for (const playerId in scores) {
                // Remove highlight from the player's nameplate
                var nameplate = document.getElementById('nameplate' + playerId);
                if (nameplate) {
                    nameplate.style.border = 'none';
                }
                //buzzedPlayerId = null;

                const scoreElement = document.getElementById('score' + playerId);
                if (scoreElement) {
                    let scoreValue = scores[playerId];
                    if (scoreValue < 0) {
                        scoreElement.textContent = '-$' + Math.abs(scoreValue);
                        scoreElement.style.color = '#d41010'; // Red color for negative scores
                    } else {
                        scoreElement.textContent = '$' + scoreValue;
                        scoreElement.style.color = '#ffffff'; // Default color
                    }
                }
            }
        }

        function showClue(clueText) {
            const clueElement = document.getElementById('clue');
            clueElement.textContent = clueText;
            clueElement.style.display = 'block';
        }
    
        function showBuzzIndicators() {
            console.log('Executing showBuzzIndicators()');
            // Add vertical white bars to indicate buzzing is enabled
            const leftIndicator = document.getElementById('left-indicator');
            const rightIndicator = document.getElementById('right-indicator');
            console.log('Left Indicator:', leftIndicator);
            console.log('Right Indicator:', rightIndicator);
            leftIndicator.style.display = 'block';
            rightIndicator.style.display = 'block';
        }

        function removeBuzzIndicators() {
            const leftIndicator = document.getElementById('left-indicator');
            const rightIndicator = document.getElementById('right-indicator');
            leftIndicator.style.display = 'none';
            rightIndicator.style.display = 'none';
        }
        
        function playTimeoutSound() {
            const timeoutSound = document.getElementById('timeout-sound');
            isTimeoutSoundPlaying = true;
            timeoutSound.play();
            timeoutSound.onended = function() {
                isTimeoutSoundPlaying = false;
                // If the clue_closed event has already been received, close the screen
                if (clueClosedReceived) {
                    closeScreen();
                }
            };
        }
        
    </script>
</body>
</html>
